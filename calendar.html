<style>
/* =========================
   CALENDAR LAYOUT
========================= */
#calendar-container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 24px 80px;
  gap: 36px;
  flex-wrap: wrap;
}

#calendar {
  width: 600px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
}

#calendar-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

#calendar-header .month-year-group {
  display: flex;
  gap: 6px;
  align-items: center;
}

#calendar-header select,
#calendar-header button {
  font-size: 14px;
  font-family: var(--font-body);
  padding: 5px 8px;
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
}

.today-btn {
  font-size: 13px !important;
  padding: 5px 12px !important;
  border-color: var(--navy) !important;
  color: var(--navy) !important;
  font-weight: 500;
}
.today-btn:hover { background: var(--navy) !important; color: #fff !important; }

#calendar-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.weekday {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  padding-bottom: 4px;
}

.day {
  height: 56px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  font-size: 14px;
  color: var(--ink-soft);
  transition: box-shadow 0.12s ease;
}

.day:hover { background: var(--surface-2); box-shadow: var(--shadow); }

.day.single { background: #F3E4C4; color: var(--ink); border-color: #E4CE97; }
.day.single:hover { background: #EFDBAC; }

.day.multi { background: var(--red); color: white; border-color: var(--red); }
.day.multi:hover { background: var(--red-deep); }

/* Today's date — an outline ring that layers on top of whichever
   background the cell already has (plain, single, or multi). */
.day.today { box-shadow: inset 0 0 0 2px var(--navy); font-weight: 600; }
.day.today:hover { box-shadow: inset 0 0 0 2px var(--navy), var(--shadow); }

/* ICONS */
.day-icons {
  position: absolute;
  bottom: 4px;
  right: 4px;
  display: flex;
  gap: 3px;
}

.day-icons img {
  width: 13px;
  height: 13px;
  filter:
    saturate(0.72) brightness(0.94) contrast(1.04)
    drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff)
    drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);
}

/* INCIDENT DISPLAY */
#incident-display {
  display: none;
  width: 320px;
  margin-top: 0;
  font-size: 14.5px;
  color: var(--ink-soft);
}

.incident-date-header {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.incident-item {
  margin-bottom: 15px;
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 10px;
  line-height: 1.5;
}

.incident-item b {
  display: block;
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 600;
  margin-bottom: 6px;
}

.incident-item a {
  color: var(--navy);
  text-decoration: underline;
}

.incident-meta-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--ink-faint);
}
.incident-meta-label::after { content: ":"; }

.view-on-map-btn {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 12px;
  background: var(--navy);
  color: #fff !important;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none !important;
}
.view-on-map-btn:hover { background: var(--navy-deep); }

/* =========================
   LEGEND
========================= */
#calendar-legend {
  margin-top: 16px;
  font-size: 14px;
  color: var(--ink-soft);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.legend-color {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  display: inline-block;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.5) inset,
    0 -1px 1px rgba(0,0,0,0.1) inset,
    0 1px 2px rgba(26,34,51,0.18);
}

.legend-color.single { background: #F3E4C4; }
.legend-color.multi { background: var(--red); }

.legend-circle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
}

.legend-circle {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: inline-block;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.65) inset,
    0 -1px 1px rgba(0,0,0,0.12) inset,
    0 1px 2px rgba(26,34,51,0.22);
}

.legend-circle.red { background: var(--red); }
.legend-circle.brown { background: #8A5A3C; }
.legend-circle.orange { background: var(--amber); }
.legend-circle.yellow { background: #D9B94A; }
.legend-circle.green { background: #4C8A5E; }

#czech-note {
  font-style: italic;
  margin-top: 12px;
  color: var(--ink-faint);
  font-size: 13px;
}

/* =========================
   MOBILE FIXES
========================= */
@media (max-width: 768px) {
  #calendar-container {
    flex-direction: column;
    align-items: center;
  }
  #calendar {
    width: 100%;
  }
  #calendar-header {
    flex-wrap: wrap;
    font-size: 19px;
  }
  #calendar-header select,
  #calendar-header button {
    font-size: 13px;
    padding: 4px 7px;
  }
  #incident-display {
    width: 100%;
  }
  #calendar-grid {
    grid-template-columns: repeat(7, 1fr);
  }
}
</style>

function getIncidentTypes(incidents) {
  const types = new Set();
  incidents.forEach(i => {
    const t = i.popupType.toLowerCase();
    let matched = false;
    if(t.includes('jet') || t.includes('airspace incursion') || t.includes('safety-zone')) { types.add('jet'); matched = true; }
    if(t.includes('balloon')) { types.add('balloon'); matched = true; }
    if(t.includes('border')) { types.add('border'); matched = true; }
    if(t.includes('drone')) { types.add('drone'); matched = true; }
    if(!matched) types.add('drone'); // plain "Crash site" / "Suspected false alarm" entries are drone-related in this dataset
  });
  return [...types];
}

/* =========================
   CALENDAR LOGIC
========================= */
const grid = document.getElementById('calendar-grid');
const incidentDisplay = document.getElementById('incident-display');
const monthSelect = document.getElementById('monthSelect');
const yearSelect = document.getElementById('yearSelect');
const czechNote = document.getElementById('czech-note');

const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let currentDate = new Date(2025,8,1);

months.forEach((m,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=m;
  monthSelect.appendChild(o);
});

[2025,2026].forEach(y=>{
  const o=document.createElement('option');
  o.value=y; o.textContent=y;
  yearSelect.appendChild(o);
});

function renderCalendar(){
  grid.innerHTML='';
  const y=currentDate.getFullYear();
  const m=currentDate.getMonth();

  monthSelect.value = m;
  yearSelect.value = y;

  const today = new Date();
  const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{
    const el=document.createElement('div');
    el.className='weekday'; el.textContent=d;
    grid.appendChild(el);
  });

  const first=new Date(y,m,1);
  const offset=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();

  for(let i=0;i<offset;i++) grid.appendChild(document.createElement('div'));

  for(let d=1;d<=days;d++){
    const el=document.createElement('div');
    el.className='day';
    el.textContent=d;

    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const incidents = incidentsData[key];

    if(incidents?.length===1) el.classList.add('single');
    if(incidents?.length>1) el.classList.add('multi');
    if(key===todayKey) el.classList.add('today');

    if(incidents){
      const icons = getIncidentTypes(incidents);
      if(icons.length){
        const box=document.createElement('div');
        box.className='day-icons';
        icons.forEach(t=>{
          const img=document.createElement('img');
          img.src=calendarIcons[t];
          box.appendChild(img);
        });
        el.appendChild(box);
      }
    }

    el.onclick=()=>{
      incidentDisplay.style.display='block';

      const clickedDate = new Date(y, m, d);
      const dateHeader = `<div class="incident-date-header">${clickedDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div>`;

      if(!incidents){
        incidentDisplay.innerHTML=dateHeader+'<i>No incidents</i>';
        return;
      }
      incidentDisplay.innerHTML=dateHeader+incidents.map(i=>`
        <div class="incident-item">
          <b>${i.country} (<a href="${i.link}" target="_blank">source</a>)</b>
          <span class="incident-meta-label">Date</span> ${i.date}<br>
          <span class="incident-meta-label">Type</span> ${i.popupType}<br>
          <span class="incident-meta-label">Details</span> ${i.details}<br>
          ${i.link ? `<a class="view-on-map-btn" href="map.html?link=${encodeURIComponent(i.link.trim())}">View on map →</a>` : ''}
        </div>
      `).join('');
    };

    grid.appendChild(el);
  }

  // Czech note only for September 2025
  if(y===2025 && m===8) czechNote.textContent='* On September 10th, the Czech army reported a growing number of drone sightings above its military bases but provided no date or place.';
  else czechNote.textContent='';
}

document.getElementById('prevMonth').onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};
document.getElementById('nextMonth').onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};
monthSelect.onchange=()=>{ currentDate.setMonth(+monthSelect.value); renderCalendar(); };
yearSelect.onchange=()=>{ currentDate.setFullYear(+yearSelect.value); renderCalendar(); };
document.getElementById('goToday').onclick=()=>{
  currentDate = new Date();
  renderCalendar();
};

renderCalendar();

/* =========================
   SIDEBAR LOGIC
========================= */
const sidebar = document.getElementById('sidebar');
const handle = document.getElementById('sidebar-handle');

handle.addEventListener('click', () => {
  const open = sidebar.classList.toggle('sidebar-open');
  handle.style.transform = open ? 'translateX(240px)' : 'translateX(0)';
  handle.innerHTML = open ? '&times;' : '&#9776;';
});
</script>
